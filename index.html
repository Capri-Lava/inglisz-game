<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Inglisz Game</title>
<meta name="theme-color" content="#a50d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inglisz Game">
<link rel="icon" type="image/png" href="icon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Playfair+Display+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
  <div class="roof"><div class="crown" aria-hidden="true"></div></div>
  <div class="sign"><span>Inglisz Game</span></div>
  <div class="door">
    <div class="panes" id="hud">
      <div class="pane">
        <div class="name" id="nameP">You</div>
        <div class="bar"><i id="hpP"></i></div>
      </div>
      <div class="pane mid">
        <svg class="clock" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="#f6ecd0" stroke="#1a1a1a" stroke-width="2"/>
          <circle id="arc" cx="20" cy="20" r="12" fill="none" stroke="#c8102e" stroke-width="8" pathLength="100" stroke-dasharray="100" transform="rotate(-90 20 20)"/>
          <g fill="#1a1a1a"><rect x="19" y="3.5" width="2" height="4"/><rect x="19" y="32.5" width="2" height="4"/><rect x="3.5" y="19" width="4" height="2"/><rect x="32.5" y="19" width="4" height="2"/></g>
          <g id="hand"><rect x="19.2" y="6" width="1.6" height="15" fill="#1a1a1a"/></g>
          <circle cx="20" cy="20" r="2" fill="#1a1a1a"/>
        </svg>
        <div id="turn"></div>
      </div>
      <div class="pane">
        <div class="name r" id="nameC">Foe</div>
        <div class="bar r"><i id="hpC"></i></div>
      </div>
    </div>
    <div class="window">
      <div id="stage">
        <canvas id="cv"></canvas>
        <div id="say" class="say"></div>
        <div id="answers"></div>
        <div id="fx"></div>

        <div id="select" class="screen show">
          <h1>Inglisz<br>Game</h1>
          <p class="sub">Wybierz bohatera</p>
          <div class="tempo"><span>Tempo</span>
            <button data-tempo="1">1 s</button><button data-tempo="2">2 s</button><button data-tempo="3">3 s</button>
          </div>
          <button class="pickzone l" data-hero="arthur"><span>King Arthur</span></button>
          <button class="pickzone r" data-hero="nigel"><span>Nigel Bumble</span></button>
        </div>

        <div id="end" class="screen">
          <div class="card">
            <h2 id="endTitle">Victory!</h2>
            <div class="score" id="endScore"></div>
            <div id="missedBox"><h3>Do powtórki</h3><ul id="missed"></ul></div>
            <button id="again">Jeszcze raz</button>
          </div>
        </div>
      </div>
    </div>
    <div class="plinth">
      <span class="handle"></span>
      <button id="mute" aria-label="Dźwięk"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w" d="M16 8.5c1.3 1 2 2.2 2 3.5s-.7 2.5-2 3.5M18.5 6c2 1.6 3 3.6 3 6s-1 4.4-3 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="x" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div class="base"></div>
</div>
<script src="js/words.js"></script>
<script src="js/audio.js"></script>
<script src="js/fighters.js"></script>
<script src="js/game.js"></script>
</body>
</html>
